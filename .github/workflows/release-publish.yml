name: Release & Publish Package
on:
  push:
    branches:
      - main
jobs:
  release:
    name: Create release package
    runs-on: ubuntu-latest
    steps: 
    - name: Checkout to code
      uses: actions/checkout@v4
    - name: install Node js Version 20.x
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
    - name: Retrieve Release Version
      run: echo "PV=$(node version.js)" >> $GITHUB_ENV
    - run: cat change-log
    - name: Retrieve Release Body
      run:  |
        {
          echo 'PB<<EOF'
          cat change-log
          echo EOF
        } >> $GITHUB_ENV
    - run: echo ${{env.PV}}
    - name: Create Github Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{env.PV}}
        release_name: Release v${{env.PV}}
        body: ${{env.PB}}
  publish-gpr:
      needs: release
      runs-on: ubuntu-latest
      permissions:
        contents: read
        packages: write
      steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          registry-url: 'https://npm.pkg.github.com'
          scope: '@mohammadrezaeicode'
      - run: npm set @mohammadrezaeicode:registry=https://npm.pkg.github.com/  
      - run: npm login --scope=@mohammadrezaeicode --registry=https://npm.pkg.github.com 
      - run: npm adduser 
      - run: npm ci
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  publish:
        name: Publish to NPM
        needs: publish-gpr
        runs-on: ubuntu-latest
        steps:    
        - name: Checkout to code
          uses: actions/checkout@v4
        - name: install Node js Version 20.x
          uses: actions/setup-node@v4
          with:
            node-version: '24.x'
            registry-url: 'https://registry.npmjs.org'
        - run: npm ci
        - name: publish to npm
          run: npm publish
          env:
              NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}